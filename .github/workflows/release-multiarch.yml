name: Release Multi-Arch

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v0.3.0

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: true
      - name: configure NDK linker
        run: |
          mkdir -p .cargo
          echo '[target.aarch64-linux-android]' > .cargo/config.toml
          echo 'linker = "aarch64-linux-android21-clang"' >> .cargo/config.toml
          cat .cargo/config.toml
      - run: cargo build --release --target aarch64-linux-android
      - run: file target/aarch64-linux-android/release/noveldownloader
      - name: upload android asset (append)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          fail_on_unmatched_files: false
          files: |
            target/aarch64-linux-android/release/noveldownloader

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: build host (aarch64)
        run: cargo build --release
      - name: build x86_64
        run: cargo build --release --target x86_64-apple-darwin
      - run: |
          cp target/release/noveldownloader target/noveldownloader-aarch64-macos
          cp target/x86_64-apple-darwin/release/noveldownloader target/noveldownloader-x86_64-macos
      - name: upload macos assets (append)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          fail_on_unmatched_files: false
          files: |
            target/noveldownloader-aarch64-macos
            target/noveldownloader-x86_64-macos

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: build iOS
        run: |
          cargo build --release --target aarch64-apple-ios 2>&1 | tee ios_build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "::warning::iOS build failed (TCP server may be incompatible with iOS sandbox). See log."
            tail -25 ios_build.log
            exit 0
          fi
          file target/aarch64-apple-ios/release/noveldownloader
      - name: upload iOS asset (append, optional)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          fail_on_unmatched_files: false
          files: |
            target/aarch64-apple-ios/release/noveldownloader