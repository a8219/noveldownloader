name: Release Multi-Arch

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v0.3.0

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: true
      - name: configure NDK toolchain
        run: |
          # setup-ndk 设置的环境变量（各版本名可能不同，逐级 fallback）
          if [ -n "$NDK_LLVM_PREBUILT" ]; then
            TOOLS="$NDK_LLVM_PREBUILT/bin"
          elif [ -n "$NDK" ]; then
            TOOLS="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          elif [ -n "$NDK_HOME" ]; then
            TOOLS="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          else
            echo "No NDK vars found. NDK=$NDK NDK_HOME=$NDK_HOME NDK_LLVM_PREBUILT=$NDK_LLVM_PREBUILT"
            exit 1
          fi
          CLANG="$TOOLS/aarch64-linux-android21-clang"
          CLANGPP="$TOOLS/aarch64-linux-android21-clang++"
          LLMAR="$TOOLS/llvm-ar"
          echo "TOOLS=$TOOLS"; echo "clang=$CLANG"
          ls -la "$CLANG"
          {
            echo "CC_aarch64_linux_android=$CLANG"
            echo "CXX_aarch64_linux_android=$CLANGPP"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$LLMAR"
          } >> "$GITHUB_ENV"
          mkdir -p .cargo
          printf '[target.aarch64-linux-android]\nlinker = "%s"\n' "$CLANG" > .cargo/config.toml
          cat .cargo/config.toml
      - run: cargo build --release --target aarch64-linux-android
      - run: file target/aarch64-linux-android/release/noveldownloader
      - name: upload android asset (append)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          fail_on_unmatched_files: false
          files: |
            target/aarch64-linux-android/release/noveldownloader:noveldownloader-aarch64-linux-android

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: build host (aarch64)
        run: cargo build --release
      - name: build x86_64
        run: cargo build --release --target x86_64-apple-darwin
      - run: |
          cp target/release/noveldownloader target/noveldownloader-aarch64-macos
          cp target/x86_64-apple-darwin/release/noveldownloader target/noveldownloader-x86_64-macos
      - name: upload macos assets (append)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          fail_on_unmatched_files: false
          files: |
            target/noveldownloader-aarch64-macos
            target/noveldownloader-x86_64-macos

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: build iOS
        run: |
          cargo build --release --target aarch64-apple-ios 2>&1 | tee ios_build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "::warning::iOS build failed (TCP server may be incompatible with iOS sandbox). See log."
            tail -25 ios_build.log
            exit 0
          fi
          file target/aarch64-apple-ios/release/noveldownloader
      - name: upload iOS asset (append, optional)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          fail_on_unmatched_files: false
          files: |
            target/aarch64-apple-ios/release/noveldownloader:noveldownloader-ios-aarch64