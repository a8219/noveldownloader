name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + NDK target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c

      - name: Configure NDK for Rust cross-compilation
        run: |
          PREBUILT="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p .cargo
          printf '[target.aarch64-linux-android]\nlinker = "%s/aarch64-linux-android21-clang"\n' "$PREBUILT" > .cargo/config.toml
          {
            echo "CC_aarch64_linux_android=$PREBUILT/aarch64-linux-android21-clang"
            echo "CXX_aarch64_linux_android=$PREBUILT/aarch64-linux-android21-clang++"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$PREBUILT/aarch64-linux-android21-clang"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$PREBUILT/llvm-ar"
          } >> "$GITHUB_ENV"
          cat .cargo/config.toml

      - name: Build Rust cdylib (aarch64-linux-android)
        run: cargo build --release --target aarch64-linux-android --features jni

      - name: Verify native library
        run: |
          ls -lh target/aarch64-linux-android/release/libnoveldownloader.so
          file target/aarch64-linux-android/release/libnoveldownloader.so

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy native library into JNI libs
        run: |
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libnoveldownloader.so android-app/app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        working-directory: android-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          find android-app -name '*.apk' -type f
          ls -lh android-app/app/build/outputs/apk/release/*.apk 2>/dev/null || ls -lh android-app/app/build/outputs/apk/*/*.apk 2>/dev/null

      - name: Upload APK to Release v0.3.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          draft: false
          fail_on_unmatched_files: false
          files: |
            android-app/app/build/outputs/apk/release/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noveldownloader-android-apk
          path: android-app/app/build/outputs/apk/release/*.apk