<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
:root{

  --md-sys-color-on-primary:#ffffff;

  --md-sys-color-secondary:#625b71;

}
[data-theme="dark"]{
  --md-sys-color-primary:#d0bcff;
  --md-sys-color-on-primary:#381e72;
  --md-sys-color-primary-container:#4f378b;
  --md-sys-color-on-primary-container:#eaddff;
  --md-sys-color-secondary:#ccc2dc;
  --md-sys-color-on-secondary:#332d41;
  --md-sys-color-secondary-container:#4a4458;
  --md-sys-color-on-secondary-container:#e8def8;
  --md-sys-color-surface:#141218;
  --md-sys-color-on-surface:#e6e0e9;
  --md-sys-color-surface-variant:#49454f;
  --md-sys-color-on-surface-variant:#cac4d0;
  --md-sys-color-outline:#938f99;
  --md-sys-color-outline-variant:#49454f;
  --md-sys-color-background:#141218;
  --md-sys-color-on-background:#e6e0e9;
  --md-sys-color-error:#f2b8b5;
  --md-sys-color-on-error:#601410;
  --md-sys-color-error-container:#8c1d18;
  --md-sys-color-on-error-container:#f9dedc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--md-sys-color-background);color:var(--md-sys-color-on-surface);font:15px/1.7 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif}
.mdc-top-app-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface);box-shadow:var(--md-sys-elevation-2)}
.mdc-top-app-bar .title{flex:1;min-width:0;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdc-icon-button{width:40px;height:40px;border:none;border-radius:50%;background:transparent;color:inherit;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mdc-icon-button:active{background:var(--md-sys-color-surface-variant)}
.mdc-search-bar{display:flex;align-items:center;gap:10px;margin:12px;padding:10px 14px;background:var(--md-sys-color-surface-variant);border-radius:28px}

.mdc-card{background:var(--md-sys-color-surface);border-radius:12px;box-shadow:var(--md-sys-elevation-1);overflow:hidden}
.book-list{list-style:none;padding:0;margin:0}
.book-item{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--md-sys-color-outline-variant);cursor:pointer}
.book-item:active{background:var(--md-sys-color-surface-variant)}
.book-cover{width:56px;height:76px;border-radius:8px;background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;overflow:hidden;flex-shrink:0}
.book-cover img{width:100%;height:100%;object-fit:cover}
.book-info{flex:1;min-width:0}
.book-title{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book-author{font-size:13px;color:var(--md-sys-color-on-surface-variant);margin-top:2px}
.book-abstract{font-size:13px;color:var(--md-sys-color-on-surface-variant);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book-status{font-size:12px;color:var(--md-sys-color-primary);margin-top:6px}
.mdc-list{list-style:none;padding:0;margin:0}
.mdc-list-item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--md-sys-color-outline-variant)}
.mdc-list-item:active{background:var(--md-sys-color-surface-variant)}
.mdc-list-item .item-title{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdc-list-item .item-meta{font-size:12px;color:var(--md-sys-color-on-surface-variant)}
.mdc-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;height:40px;border:none;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary)}
.mdc-button:active{opacity:.8}
.mdc-button.tonal{background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container)}
.mdc-button.text{background:transparent;color:var(--md-sys-color-primary)}
.mdc-button:disabled{opacity:.4;cursor:default}
.mdc-fab{position:fixed;right:20px;bottom:24px;width:var(--md-fab-size);height:var(--md-fab-size);border-radius:16px;background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);box-shadow:var(--md-sys-elevation-3);border:none;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:15}
.mdc-fab:active{opacity:.85}
.mdc-navigation-bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--md-sys-color-surface);box-shadow:0 -1px 3px rgba(0,0,0,.1);z-index:14}
.mdc-navigation-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:11px;color:var(--md-sys-color-on-surface-variant);cursor:pointer}
.mdc-navigation-item.active{color:var(--md-sys-color-primary)}
.mdc-navigation-item .nav-icon{font-size:20px}
main{max-width:720px;margin:0 auto;padding:12px 0 88px}
#content{white-space:pre-wrap;word-wrap:break-word;font-size:var(--fs,17px);line-height:1.95;padding:4px 18px}
.read-nav{display:flex;gap:10px;margin:20px 0;padding:0 16px}
.read-nav .mdc-button{flex:1}
.tip{color:var(--md-sys-color-on-surface-variant);font-size:14px;text-align:center;padding:32px 0}
.loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;display:none;z-index:30}
.loading.on{display:block}
.skeleton{background:var(--md-sys-color-surface-variant);border-radius:8px;height:16px;margin:12px 0}
@media(min-width:600px){main{max-width:840px}}
</style>

<body>
<header class="mdc-top-app-bar">
  <button class="mdc-icon-button" id="back">&#8592;</button>

<div id='ttsCfgPanel' style='display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;padding:32px 16px'>
  <div style='background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface);max-width:420px;margin:0 auto;border-radius:16px;padding:20px;box-sizing:border-box'>

    <label style='display:block;font-size:13px;margin:8px 0 2px'>引擎</label>

      <option value='system'>系统语音（默认）</option>
      <option value='custom'>自定义 TTS API</option>
    </select>
    <label style='display:block;font-size:13px;margin:8px 0 2px'>服务地址（OpenAI 兼容，如 https://api.openai.com/v1）</label>
    <input id='ttsBase' placeholder='https://.../v1' style='width:100%;padding:8px;border:1px solid var(--md-sys-color-outline);border-radius:8px;background:var(--md-sys-color-surface-variant);color:inherit;box-sizing:border-box'>
    <label style='display:block;font-size:13px;margin:8px 0 2px'>API Key</label>
    <input id='ttsKey' type='password' placeholder='sk-...' style='width:100%;padding:8px;border:1px solid var(--md-sys-color-outline);border-radius:8px;background:var(--md-sys-color-surface-variant);color:inherit;box-sizing:border-box'>
    <label style='display:block;font-size:13px;margin:8px 0 2px'>模型（可选）</label>
    <input id='ttsModel' placeholder='tts-1' style='width:100%;padding:8px;border:1px solid var(--md-sys-color-outline);border-radius:8px;background:var(--md-sys-color-surface-variant);color:inherit;box-sizing:border-box'>
    <label style='display:block;font-size:13px;margin:8px 0 2px'>音色（可选）</label>
    <input id='ttsVoice' placeholder='alloy' style='width:100%;padding:8px;border:1px solid var(--md-sys-color-outline);border-radius:8px;background:var(--md-sys-color-surface-variant);color:inherit;box-sizing:border-box'>
    <div style='margin-top:16px;display:flex;gap:8px'>
      <button class='mdc-button' id='ttsSave'>保存</button>
      <button class='mdc-button text' id='ttsClose'>取消</button>
    </div>
    <div style='font-size:12px;color:var(--md-sys-color-on-surface-variant);margin-top:8px'>自定义 TTS API 需服务商允许跨域；配置保存在本浏览器。</div>
  </div>
</div>
<div id='acctPanel' style='display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;padding:32px 16px'>
  <div style='background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface);max-width:380px;margin:0 auto;border-radius:16px;padding:20px;box-sizing:border-box'>
    <h3 style='margin:0 0 4px;font-size:17px'>账号</h3>
    <div id='acctStatus' style='font-size:13px;color:var(--md-sys-color-on-surface-variant);margin-bottom:10px'>未登录（TG 同一账号可直接登录）</div>
    <div id='acctLogin' style='display:block'>
      <label style='display:block;font-size:13px;margin:6px 0 2px'>账号（TG 注册的用户名）</label>
      <input id='acctName' style='width:100%;padding:8px;border:1px solid var(--md-sys-color-outline);border-radius:8px;background:var(--md-sys-color-surface-variant);color:inherit;box-sizing:border-box' placeholder='用户名'>
      <label style='display:block;font-size:13px;margin:6px 0 2px'>密码</label>
      <input id='acctPass' type='password' style='width:100%;padding:8px;border:1px solid var(--md-sys-color-outline);border-radius:8px;background:var(--md-sys-color-surface-variant);color:inherit;box-sizing:border-box' placeholder='密码'>
      <div style='margin-top:12px;display:flex;gap:8px'>
        <button class='mdc-button' id='acctLoginBtn'>登录</button>
        <button class='mdc-button text' id='acctClose'>关闭</button>
      </div>
      <div style='font-size:12px;color:var(--md-sys-color-on-surface-variant);margin-top:8px'>没有账号？在 Telegram 给机器人发送 /signup 注册（用户名+密码），这里即可登录。</div>
    </div>
    <div id='acctLogged' style='display:none'>
      <div style='font-size:14px;margin:4px 0'>已登录：<b id='acctNameShown'></b></div>
      <div style='margin-top:10px;display:flex;gap:8px;flex-wrap:wrap'>
        <button class='mdc-button tonal' id='histBtn'>阅读历史</button>
        <button class='mdc-button text' id='logoutBtn'>退出登录</button>
        <button class='mdc-button text' id='acctClose2'>关闭</button>
      </div>
    </div>
  </div>
</div>
<div id='histPanel' style='display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;padding:32px 16px'>
  <div style='background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface);max-width:420px;margin:0 auto;border-radius:16px;padding:20px;box-sizing:border-box'>
    <h3 style='margin:0 0 10px;font-size:17px'>阅读历史</h3>
    <div id='histList' style='max-height:50vh;overflow:auto;font-size:14px'>加载中…</div>
    <div style='margin-top:12px'><button class='mdc-button text' id='histClose'>关闭</button></div>
  </div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var bookId = q.get('book_id') || '';
  var itemId = q.get('item_id') || '';
  var src = q.get('source') || 'fanqie';  // fanqie | qimao | ciweimao
  var app = document.getElementById('app');
  var titleEl = document.getElementById('title');
  var loading = document.getElementById('loading');
  var dirCache = [], dirMap = {}, detailCache = null, searchCache = null;
  var SOURCES = {
    fanqie: { name: '番茄小说', search: '/api/search?key=', directory: '/api/directory?book_id=', content: '/api/content?item_id=' },
    qimao:  { name: '七猫中文网', search: '/api/qimao/search?key=', directory: '/api/qimao/directory?book_id=', content: '/api/qimao/content?item_id=' },
    ciweimao: { name: '刺猬猫', search: '/api/ciweimao/search?key=', directory: '/api/ciweimao/directory?book_id=', content: '/api/ciweimao/content?item_id=' }
  };
  function ep(kind, id){
    var s = SOURCES[src] || SOURCES.fanqie;
    if ((src === 'qimao' || src === 'ciweimao') && kind === 'detail') return s.directory + encodeURIComponent(id || '');
    if ((src === 'qimao' || src === 'ciweimao') && kind === 'content') return s.content + encodeURIComponent(id || '') + '&book_id=' + encodeURIComponent(bookId || '');
    return s[kind] + encodeURIComponent(id || '');
  }

  var savedTheme = localStorage.getItem('md3_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  var fs = parseInt(localStorage.getItem('md3_fs') || '17', 10);
  document.documentElement.style.setProperty('--fs', fs + 'px');

  var ttsOn = false, ttsPaused = false, ttsBtn = document.getElementById('tts');
function ttsText(){ var el = document.getElementById('content'); if (!el) return ''; return (el.textContent || '').replace(/\s+/g, ' ').trim(); }
var acctToken = localStorage.getItem('acctToken') || '';
var acctName = localStorage.getItem('acctName') || '';
function acctHdr(){ return acctToken ? {'x-auth-token': acctToken} : {}; }
function acctRender(){
  var loginBox=document.getElementById('acctLogin');
  var loggedBox=document.getElementById('acctLogged');
  var st=document.getElementById('acctStatus');
  if(!loginBox||!loggedBox) return;
  if(acctToken){ loginBox.style.display='none'; loggedBox.style.display='block';
    if(st) st.textContent='已登录'; var n=document.getElementById('acctNameShown'); if(n) n.textContent=acctName; }
  else { loginBox.style.display='block'; loggedBox.style.display='none';
    if(st) st.textContent='未登录（TG 同一账号可直接登录）'; }
}
function acctOpen(){ acctRender(); document.getElementById('acctPanel').style.display='block'; }
function acctClose(){ document.getElementById('acctPanel').style.display='none'; }
function acctLogin(){
  var a=(document.getElementById('acctName').value||'').trim();
  var p=document.getElementById('acctPass').value||'';
  if(!a||!p){ alert('请输入账号和密码'); return; }
  fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({account:a,password:p})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.code!==200){ alert(d.message||'登录失败'); return; }
      acctToken=d.token; acctName=d.account;
      localStorage.setItem('acctToken',acctToken); localStorage.setItem('acctName',acctName);
      acctRender();
    }).catch(function(e){ alert('登录失败: '+e); });
}
function acctLogout(){
  acctToken=''; acctName='';
  localStorage.removeItem('acctToken'); localStorage.removeItem('acctName');
  acctRender();
}
function histOpen(){if(!acctToken){var b0=document.getElementById('histList');document.getElementById('histPanel').style.display='block';var ha={};try{ha=JSON.parse(localStorage.getItem('nd_hist_local')||'{}')}catch(e0){ha={}}var a0=Object.keys(ha).map(function(k){var v=ha[k]||{};return{book_id:k,book_name:v.book_name,item_id:v.item_id,chapter_title:v.chapter_title,ts:v.ts,source:v.source}});a0.sort(function(x,y){return(y.ts||0)-(x.ts||0)});if(!a0.length){b0.textContent='暂无阅读记录';return;}b0.innerHTML='';for(var i0=0;i0<a0.length;i0++){(function(t0){var r0=document.createElement('div');r0.style.cssText='padding:10px 0;border-bottom:1px solid var(--md-sys-color-outline-variant);cursor:pointer';var n0=document.createElement('div');n0.style.fontWeight='600';n0.textContent=t0.book_name||t0.book_id;var m0=document.createElement('div');m0.style.cssText='font-size:12px;color:var(--md-sys-color-on-surface-variant)';m0.textContent=(t0.chapter_title||'')+(t0.ts?' · '+new Date(t0.ts).toLocaleString():'');r0.appendChild(n0);r0.appendChild(m0);r0.onclick=function(){document.getElementById('histPanel').style.display='none';src=t0.source||src;go(t0.book_id,t0.item_id||'')};b0.appendChild(r0)})(a0[i0]);}return;}
  document.getElementById('histPanel').style.display='block';
  var box=document.getElementById('histList'); box.textContent='加载中…';
  fetch('/api/history',{headers:acctHdr()}).then(function(r){return r.json();}).then(function(d){
    if(d.code!==200){ box.textContent=d.message||'加载失败'; return; }
    var arr=d.data||[];
    if(!arr.length){ box.textContent='暂无阅读记录'; return; }
    box.innerHTML='';
    for(var i=0;i<arr.length;i++){
      var it=arr[i]; var row=document.createElement('div');
      row.style.cssText='padding:10px 0;border-bottom:1px solid var(--md-sys-color-outline-variant);cursor:pointer';
      var nm=document.createElement('div'); nm.style.fontWeight='600'; nm.textContent=it.book_name||it.book_id;
      var meta=document.createElement('div'); meta.style.cssText='font-size:12px;color:var(--md-sys-color-on-surface-variant)';
      meta.textContent=(it.chapter_title||'') + (it.ts? ' · '+new Date(it.ts).toLocaleString():'');
      row.appendChild(nm); row.appendChild(meta);
      (function(rec){ row.onclick=function(){ document.getElementById('histPanel').style.display='none'; src=rec.source||src; go(rec.book_id, rec.item_id||''); }; })(it);
      box.appendChild(row);
    }
  }).catch(function(e){ box.textContent='加载失败: '+e; });
}
function histSave(bookId, bookName, itemId, chTitle){
  if(!bookId) return;try{var hk='nd_hist_'+(acctName||'local');var ha=JSON.parse(localStorage.getItem(hk)||'{}');ha[bookId]={book_name:bookName||'',item_id:itemId||'',chapter_title:chTitle||'',ts:Date.now(),source:src};var hks=Object.keys(ha);if(hks.length>200){hks.sort(function(a,b){return(ha[a].ts||0)-(ha[b].ts||0)});for(var hi=0;hi<hks.length-200;hi++)delete ha[hks[hi]];}localStorage.setItem(hk,JSON.stringify(ha))}catch(eH){}if(!acctToken) return;
  fetch('/api/history',{method:'POST',headers:Object.assign({'content-type':'application/json'},acctHdr()),body:JSON.stringify({book_id:bookId,book_name:bookName||'',item_id:itemId||'',chapter_title:chTitle||'',source:src})}).catch(function(){});
}
var acctBtnEl=document.getElementById('acctBtn');
if(acctBtnEl) acctBtnEl.onclick=function(){ acctOpen(); };
var _al=document.getElementById('acctLoginBtn'); if(_al) _al.onclick=acctLogin;
var _ac1=document.getElementById('acctClose'); if(_ac1) _ac1.onclick=acctClose;
var _ac2=document.getElementById('acctClose2'); if(_ac2) _ac2.onclick=acctClose;
var _lo=document.getElementById('logoutBtn'); if(_lo) _lo.onclick=acctLogout;
var _hb=document.getElementById('histBtn'); if(_hb) _hb.onclick=histOpen;

acctRender();
function ttsCfgLoad(){
  try { return JSON.parse(localStorage.getItem('ttsCfg') || 'null'); } catch (e) { return null; }
}
function ttsCfgOpen(){
  var c = ttsCfgLoad() || {};
  document.getElementById('ttsEngine').value = (c.engine === 'custom') ? 'custom' : 'system';
  document.getElementById('ttsBase').value = c.base || '';
  document.getElementById('ttsKey').value = c.key || '';
  document.getElementById('ttsModel').value = c.model || '';
  document.getElementById('ttsVoice').value = c.voice || '';
  document.getElementById('ttsCfgPanel').style.display = 'block';
}
function ttsCfgSave(){
  var c = { engine: document.getElementById('ttsEngine').value,
    base: document.getElementById('ttsBase').value.trim(),
    key: document.getElementById('ttsKey').value.trim(),
    model: document.getElementById('ttsModel').value.trim(),
    voice: document.getElementById('ttsVoice').value.trim() };
  localStorage.setItem('ttsCfg', JSON.stringify(c));
  document.getElementById('ttsCfgPanel').style.display = 'none';
  if (ttsBtn) ttsBtn.textContent = '🔊';
}
function ttsCfgClose(){
  document.getElementById('ttsCfgPanel').style.display = 'none';
}

function ttsStop(){ if ('speechSynthesis' in window) if (window.__ttsAudio){ try { window.__ttsAudio.pause(); } catch (e) {} window.__ttsAudio = null; }
window.speechSynthesis.cancel(); if (ttsAudio){ ttsAudio.pause(); ttsAudio.src = ''; ttsAudio = null; } ttsOn = false; ttsPaused = false; if (ttsBtn) ttsBtn.textContent = '🔊'; }
function ttsSpeak(){
  var txt = ttsText(); if (!txt) return;
  var cfg = ttsCfgLoad();
  if (cfg && cfg.engine === 'custom' && cfg.base && cfg.key) { ttsCustom(cfg, txt); }
  else { ttsFallback(txt); }
}
function ttsCustom(cfg, txt){
  fetch((cfg.base.endsWith('/') ? cfg.base : cfg.base + '/') + 'audio/speech', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'authorization': 'Bearer ' + cfg.key },
    body: JSON.stringify({ model: cfg.model || 'tts-1', voice: cfg.voice || 'alloy', input: txt.slice(0, 1500), response_format: 'mp3' })
  })
    .then(function(r){ if (!r.ok) throw new Error('status ' + r.status); return r.blob(); })
    .then(function(blob){
      var url = URL.createObjectURL(blob);
      var au = new Audio(url);
      au.onended = function(){ ttsStop(); URL.revokeObjectURL(url); };
      au.onerror = function(){ URL.revokeObjectURL(url); ttsFallback(txt); };
      au.play().catch(function(){ URL.revokeObjectURL(url); ttsFallback(txt); });
      ttsOn = true; ttsPaused = false; if (ttsBtn) ttsBtn.textContent = '⏸';
      window.__ttsAudio = au;
    })
    .catch(function(){ ttsFallback(txt); });
}
function ttsFallback(txt){
  if (!('speechSynthesis' in window)){ alert('TTS 未配置且浏览器不支持系统朗读'); return; }
  window.speechSynthesis.cancel();
  var chunks = txt.match(/[^。！？!?]+[。！？!?]?/g) || [txt];
  var list = [];
  for (var i = 0; i < chunks.length; i++){ var u = new SpeechSynthesisUtterance(chunks[i]); u.lang = 'zh-CN'; u.rate = 1; u.pitch = 1; list.push(u); }
  for (var j = 0; j < list.length; j++){
    (function(u, idx){ u.onend = function(){ if (idx < list.length - 1){ speechSynthesis.speak(list[idx + 1]); } else { ttsStop(); } }; })(list[j], j);
  }
  speechSynthesis.speak(list[0]);
  ttsOn = true; ttsPaused = false; if (ttsBtn) ttsBtn.textContent = '⏸';
}
var ttsAudio = null;
function ttsSystemSpeak(txt){
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var chunks = txt.match(/[^。！？!?]+[。！？!?]?/g) || [txt];
  var list = [];
  for (var i = 0; i < chunks.length; i++){ var u = new SpeechSynthesisUtterance(chunks[i]); u.lang = 'zh-CN'; u.rate = 1; u.pitch = 1; list.push(u); }
  for (var j = 0; j < list.length; j++){
    (function(u, idx){ u.onend = function(){ if (idx < list.length - 1){ speechSynthesis.speak(list[idx + 1]); } else { ttsStop(); } }; })(list[j], j);
  }
  speechSynthesis.speak(list[0]);
}
var ttsCfgBtn = document.getElementById('ttsCfgBtn');
if (ttsCfgBtn) ttsCfgBtn.onclick = function(){ ttsCfgOpen(); };
var ttsSave = document.getElementById('ttsSave');
if (ttsSave) ttsSave.onclick = function(){ ttsCfgSave(); };
var ttsClose = document.getElementById('ttsClose');
if (ttsClose) ttsClose.onclick = function(){ ttsCfgClose(); };
if (ttsBtn) ttsBtn.onclick = function(){
  if (!('speechSynthesis' in window)) return;
  if (ttsOn && ttsPaused){ speechSynthesis.resume(); ttsPaused = false; ttsBtn.textContent = '⏸'; }
  else if (ttsOn){ speechSynthesis.pause(); ttsPaused = true; ttsBtn.textContent = '▶'; }
  else ttsSpeak();
};
  document.getElementById('theme').onclick = function(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (dark) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('md3_theme', dark ? '' : 'dark');
  };
  document.getElementById('back').onclick = function(){
    if (itemId && bookId) { go(bookId, ''); }
    else if (bookId) { go('', ''); }
    else if (history.length > 1) history.back();
    else location.href = '/';
  };

  function show(on){ loading.className = on ? 'loading on' : 'loading'; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function setTitle(s){ titleEl.textContent = s; document.title = s; }
  function api(path){ return fetch(path, { headers: { accept: 'application/json' } }).then(function(r){ return r.json(); }); }
  function setNav(view){ var items = document.querySelectorAll('.mdc-navigation-item'); for(var i=0;i<items.length;i++){ items[i].className = items[i].getAttribute('data-view')===view ? 'mdc-navigation-item active' : 'mdc-navigation-item'; } }

  function go(book, item){
    bookId = book || ''; itemId = item || '';
    var qs = [];
    if (bookId) qs.push('book_id=' + encodeURIComponent(bookId));
    if (itemId) qs.push('item_id=' + encodeURIComponent(itemId));
    if (src && src !== 'fanqie') qs.push('source=' + encodeURIComponent(src));
    history.pushState({}, '', qs.length ? '?' + qs.join('&') : location.pathname);
    render();
    window.scrollTo(0, 0);
  }

  function renderHome(){
    setTitle('在线阅读'); setNav('home');
    var cur = SOURCES[src] || SOURCES.fanqie;
    app.innerHTML = '<div style="padding:16px 18px">' +
      '<div style="display:flex;gap:8px;margin-bottom:12px">' +
      '<button class="mdc-button' + (src==='fanqie'?'':' text') + '" id="srcFanqie" style="flex:1;height:40px">番茄小说</button>' +
      '<button class="mdc-button' + (src==='qimao'?'':' text') + '" id="srcQimao" style="flex:1;height:40px">七猫中文网</button>' +
      '</div>' +
      '<h1 style="font-size:22px;margin:0 0 4px">' + cur.name + '</h1>' +
      '<div style="font-size:14px;color:var(--md-sys-color-on-surface-variant)">快速在线阅读，支持书名搜索</div>' +
      '<div class="mdc-search-bar"><span class="search-icon">&#128269;</span><input id="bid" placeholder="输入书名、链接或书籍 ID" autocomplete="off"></div>' +
      '<button class="mdc-button" id="go" style="width:100%;height:48px;border-radius:24px">打开书籍</button>' +
      '<div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);margin-top:16px;line-height:1.8">提示：' + (src==='qimao' ? '可直接输入七猫书籍 ID（如 1655407）或书名搜索。' : (src==='ciweimao' ? '刺猬猫暂不支持站内搜索，请直接粘贴书籍链接（如 https://www.ciweimao.com/book/100119445）或书籍 ID。' : '搜索需配置 FANQIE_PROXY_API 代理；也可以直接粘贴番茄小说链接或书籍 ID。')) + '</div>' +
      '</div>';
    var open = function(){
      var v = (document.getElementById('bid').value || '').trim();
      if (!v) return;
      var m = v.match(/(\d{10,})/);
      go(m ? m[1] : v, '');
    };
    document.getElementById('go').onclick = open;
    document.getElementById('bid').addEventListener('keydown', function(e){ if (e.key === 'Enter') open(); });
    var f = document.getElementById('srcFanqie');
    var qm = document.getElementById('srcQimao');
    var cw = document.getElementById('srcCiweimao');
    if (f) f.onclick = function(){ src='fanqie'; renderHome(); };
    if (qm) qm.onclick = function(){ src='qimao'; renderHome(); };
    if (cw) cw.onclick = function(){ src='ciweimao'; renderHome(); };
  }

  function renderSearch(){
    setTitle('搜索' + (SOURCES[src]||SOURCES.fanqie).name); setNav('search');
    app.innerHTML = '<div style="padding:12px 16px 4px;font-size:13px;color:var(--md-sys-color-on-surface-variant)">当前书源：' + (SOURCES[src]||SOURCES.fanqie).name + '</div>' +
      '<div class="mdc-search-bar"><span class="search-icon">&#128269;</span><input id="sq" placeholder="搜索书名" autocomplete="off"><button class="mdc-icon-button" id="sgo" style="color:var(--md-sys-color-primary)">&#8594;</button></div>' +
      '<div id="results"></div>';
    var input = document.getElementById('sq');
    var doSearch = function(){
      var k = (input.value || '').trim();
      if (!k) return;
      show(true);
      api(ep('search', k)).then(function(r){
        show(false);
        renderResults(r);
      }).catch(function(e){ show(false); document.getElementById('results').innerHTML = '<div class="tip">搜索失败：' + esc(e && e.message ? e.message : e) + '</div>'; });
    };
    document.getElementById('sgo').onclick = doSearch;
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') doSearch(); });
    if (searchCache) renderResults(searchCache);
  }

  function renderResults(r){
    var box = document.getElementById('results');
    if (!box) return;
    searchCache = r;
    var data = (r && r.data) || {};
    var list = data.search_book_data_list || data.book_list || data.book_ids || [];
    if (r && r.code === 501) { box.innerHTML = '<div class="tip">' + esc(r.message || '搜索不可用') + '</div>'; return; }
    if (!list || !list.length) { box.innerHTML = '<div class="tip">未找到相关书籍</div>'; return; }
    var html = '<ul class="book-list">';
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (typeof b === 'string') { html += '<li class="book-item" data-id="' + esc(b) + '"><div class="book-info"><div class="book-title">' + esc(b) + '</div></div></li>'; continue; }
      var bid = b.book_id || b.bookId || b.id || '';
      var name = b.book_name || b.title || b.bookName || (bid ? ('书籍 ' + bid) : '未知');
      var author = b.author || b.author_name || '';
      var cover = b.thumb_url || b.cover || b.thumb || '';
      var abstr = b.book_abstract || b.abstract || '';
      var status = b.creation_status || b.status || '';
      var statusTxt = status === '1' || status === 'serial' || status === '连载' ? '连载中' : (status === '2' || status === 'finished' ? '已完结' : '');
      html += '<li class="book-item" data-id="' + esc(bid) + '">';
      html += '<div class="book-cover">' + (cover ? '<img src="' + esc(cover) + '" alt="">' : esc((name || '').slice(0,1))) + '</div>';
      html += '<div class="book-info"><div class="book-title">' + esc(name) + '</div>';
      if (author) html += '<div class="book-author">' + esc(author) + '</div>';
      if (abstr) html += '<div class="book-abstract">' + esc(String(abstr).slice(0, 80)) + '</div>';
      if (statusTxt) html += '<div class="book-status">' + esc(statusTxt) + '</div>';
      html += '</div></li>';
    }
    html += '</ul>';
    box.innerHTML = html;
    var items = box.querySelectorAll('.book-item');
    for (var k = 0; k < items.length; k++) items[k].onclick = function(){ var id = this.getAttribute('data-id'); if (id) go(id, ''); };
  }

  function renderBook(){
    show(true);
    Promise.all([
      detailCache ? Promise.resolve(detailCache) : api(ep('detail', bookId)),
      api(ep('directory', bookId))
    ]).then(function(res){
      show(false);
      var d = res[0] || {}, dd = res[1] || {};
      detailCache = d;
      var info = (d.data && (d.data.book_name || d.data.bookName)) ? d.data : (dd.data || {});
      var name = info.book_name || info.bookName || ('书籍 ' + bookId);
      setTitle(name);
      var lists = (dd.data && dd.data.lists) || [];
      dirCache = lists; dirMap = {};
      for (var i = 0; i < lists.length; i++) dirMap[String(lists[i].item_id)] = lists[i];
      var cover = info.cover || info.thumb_url || '';
      var html = '<div class="mdc-card" style="margin:16px"><div style="display:flex;gap:14px;padding:16px">';
      html += '<div class="book-cover" style="width:88px;height:120px">' + (cover ? '<img src="' + esc(cover) + '" alt="">' : esc((name || '').slice(0,1))) + '</div>';
      html += '<div style="flex:1;min-width:0"><div class="book-title" style="font-size:18px">' + esc(name) + '</div>';
      if (info.author) html += '<div class="book-author">' + esc(info.author) + '</div>';
      html += '<div class="book-status">共 ' + lists.length + ' 章</div>';
      html += '<button class="mdc-button" id="read" style="margin-top:12px">开始阅读</button>';
      html += '</div></div>';
      if (info.abstract) html += '<div style="padding:0 16px 14px;font-size:14px;color:var(--md-sys-color-on-surface-variant);line-height:1.7">' + esc(String(info.abstract).slice(0, 200)) + '</div>';
      html += '</div>';
      if (!lists.length) html += '<div class="tip">目录为空，请检查书籍 ID</div>';
      else {
        html += '<div style="padding:8px 16px;font-size:14px;font-weight:600;color:var(--md-sys-color-on-surface-variant)">章节目录</div>';
        html += '<ul class="mdc-list">';
        for (var j = 0; j < lists.length; j++) {
          var c = lists[j];
          html += '<li class="mdc-list-item" data-item="' + esc(c.item_id) + '"><span class="item-title">' + esc(c.title || ('第 ' + (c.order || j + 1) + ' 章')) + '</span><span class="item-meta">' + (c.word_number ? Math.round(c.word_number/1000) + 'k字' : '') + '</span></li>';
        }
        html += '</ul>';
      }
      app.innerHTML = html;
      var readBtn = document.getElementById('read');
      if (readBtn && lists.length) readBtn.onclick = function(){ go(bookId, lists[0].item_id); };
      var items = app.querySelectorAll('.mdc-list-item');
      for (var k = 0; k < items.length; k++) items[k].onclick = function(){ go(bookId, this.getAttribute('data-item')); };
    }).catch(function(e){
      show(false);
      app.innerHTML = '<div class="tip">加载失败：' + esc(e && e.message ? e.message : e) + '</div>';
    });
  }

  function renderChapter(){
    show(true);
    api(ep('content', itemId)).then(function(r){
      show(false);
      var d = r.data || {};
      var title = d.title || (dirMap[itemId] && dirMap[itemId].title) || '章节';
      var text = d.content || '';
      if (!text) { app.innerHTML = '<div class="tip">本章获取失败或需登录，请稍后重试。</div>'; return; }
      if (d.paid) { app.innerHTML = '<div class="tip">' + esc(d.notice || '本章为付费章节，本项目仅支持免费内容。') + '</div>'; return; }
      setTitle(title + (d.book_name ? ' - ' + d.book_name : ''));
      try { histSave(bookId, d.book_name || '', itemId, title); } catch (e) {}
      var idx = -1;
      for (var i = 0; i < dirCache.length; i++) if (String(dirCache[i].item_id) === String(itemId)) { idx = i; break; }
      var html = '<div style="padding:14px 18px 0"><div style="font-size:18px;font-weight:600">' + esc(title) + '</div>';
      if (d.book_name) html += '<div style="font-size:13px;color:var(--md-sys-color-on-surface-variant);margin-top:2px">' + esc(d.book_name) + '</div>';
      html += '</div><div id="content">' + esc(text) + '</div><div class="read-nav">';
      html += '<button class="mdc-button" id="prev"' + (idx > 0 ? '' : ' disabled') + '>上一章</button>';
      html += '<button class="mdc-button tonal" id="toc">目录</button>';
      html += '<button class="mdc-button" id="next"' + (idx >= 0 && idx < dirCache.length - 1 ? '' : ' disabled') + '>下一章</button></div>';
      app.innerHTML = html;
      document.getElementById('toc').onclick = function(){ go(bookId, ''); };
      document.getElementById('prev').onclick = function(){ if (idx > 0) go(bookId, dirCache[idx - 1].item_id); };
      document.getElementById('next').onclick = function(){ if (idx >= 0 && idx < dirCache.length - 1) go(bookId, dirCache[idx + 1].item_id); };
    }).catch(function(e){
      show(false);
      app.innerHTML = '<div class="tip">加载失败：' + esc(e && e.message ? e.message : e) + '</div>';
    });
  }

  function render(){
    try { ttsStop(); } catch (e) {}
    detailCache = null;
    if (itemId && bookId) renderChapter();
    else if (bookId) renderBook();
    else renderHome();
  }

  window.addEventListener('popstate', function(){
    var p = new URLSearchParams(location.search);
    bookId = p.get('book_id') || ''; itemId = p.get('item_id') || '';
    src = p.get('source') || 'fanqie';
    render();
  });

  // 底部导航
  var navItems = document.querySelectorAll('.mdc-navigation-item');
  for (var ni = 0; ni < navItems.length; ni++) {
    navItems[ni].onclick = function(){
      var v = this.getAttribute('data-view');
      if (v === 'search') { go('', ''); renderSearch(); }
      else { go('', ''); renderHome(); }
    };
  }

  render();
})();
</script>
